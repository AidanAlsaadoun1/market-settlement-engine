# One-command bring-up: database -> migrations -> indexer, in order.
# Config comes from .env at the repo root (compose reads it automatically).
services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The healthcheck is what lets the other services wait properly:
    # "container started" and "postgres ready" are different moments.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    image: migrate/migrate:4
    volumes:
      - ./indexer/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:dev@postgres:5432/postgres?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    build: ./indexer
    environment:
      RPC_URL: ${RPC_URL}
      CONTRACT: ${CONTRACT}
      # Inside the compose network the DB host is the service name,
      # not localhost - this overrides whatever .env says for local runs.
      DATABASE_URL: postgres://postgres:dev@postgres:5432/postgres?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped   # crash-safe by design; the checkpoint makes restarts free

volumes:
  pgdata: